[package]
name = "ookcite-mcp"
version = "0.4.9"
edition = "2021"
license = "MIT"
description = "MCP server for OokCite citation validation and formatting"
repository = "https://github.com/TurtleTech-ehf/ookcite-mcp"
homepage = "https://ookcite.turtletech.us"
readme = "README.md"
keywords = ["mcp", "citations", "doi", "bibtex", "academic"]
categories = ["command-line-utilities", "science"]

[dependencies]
rmcp = { version = "1.2", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
webpki-roots = "0.26"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1"
urlencoding = "2.1.3"
# age + secrecy drive the contract-encrypt helper and the contract test.
# Kept as normal deps (not dev-only) so `cargo run --bin contract-encrypt`
# works in the regen script without a separate build profile.
age = "0.10"
secrecy = "0.8"

[dev-dependencies]
wiremock = "0.6"
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lib]
name = "ookcite_mcp"
path = "src/lib.rs"

[[bin]]
name = "ookcite-mcp"
path = "src/main.rs"

[[bin]]
name = "contract-encrypt"
path = "src/bin/contract-encrypt.rs"

[package.metadata.binstall]
# Directs binstall to your GitHub Releases format
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
# Specifies that the binary rests at the root of the archive (not nested in a folder)
bin-dir = "{ bin }{ os-ext }"
# Defaults to tar.gz (tgz) for Unix systems
pkg-fmt = "tgz"
# Overrides the format to zip for Windows systems
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
