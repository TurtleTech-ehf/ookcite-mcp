[package]
name = "ookcite-mcp"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "MCP server for OokCite citation validation and formatting"
repository = "https://github.com/TurtleTech-ehf/ookcite-mcp"
homepage = "https://ookcite.turtletech.us"
readme = "README.md"
keywords = ["mcp", "citations", "doi", "bibtex", "academic"]
categories = ["command-line-utilities", "science"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ookcite-mcp-{ target }.tar.gz"
bin-dir = "./"
pkg-fmt = "tgz"

[dependencies]
rmcp = { version = "1.2", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
webpki-roots = "0.26"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
