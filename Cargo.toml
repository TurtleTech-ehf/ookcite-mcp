[package]
name = "ookcite-mcp"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "MCP server for OokCite citation validation and formatting"
repository = "https://github.com/TurtleTech-ehf/ookcite-mcp"
homepage = "https://ookcite.turtletech.us"
readme = "README.md"
keywords = ["mcp", "citations", "doi", "bibtex", "academic"]
categories = ["command-line-utilities", "science"]

[dependencies]
rmcp = { version = "1.2", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
webpki-roots = "0.26"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
urlencoding = "2.1.3"
dirs = "6"

[package.metadata.binstall]
# Directs binstall to your GitHub Releases format
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
# Specifies that the binary rests at the root of the archive (not nested in a folder)
bin-dir = "{ bin }{ os-ext }"
# Defaults to tar.gz (tgz) for Unix systems
pkg-fmt = "tgz"
# Overrides the format to zip for Windows systems
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
