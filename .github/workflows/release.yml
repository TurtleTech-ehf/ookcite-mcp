name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: ookcite-mcp-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: ookcite-mcp-aarch64-unknown-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
            name: ookcite-mcp-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            name: ookcite-mcp-aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: ookcite-mcp-x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          # Copy keeping the original binary name, then archive the binary into a named tarball
          cp target/${{ matrix.target }}/release/ookcite-mcp ./ookcite-mcp
          chmod +x ./ookcite-mcp
          tar czf ${{ matrix.name }}.tar.gz ookcite-mcp
          sha256sum ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          # Copy keeping the original binary name, then archive into a named zip
          cp target/${{ matrix.target }}/release/ookcite-mcp.exe .\ookcite-mcp.exe
          Compress-Archive -Path .\ookcite-mcp.exe -DestinationPath ${{ matrix.name }}.zip
          Get-FileHash ${{ matrix.name }}.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  ${{ matrix.name }}.zip" } | Out-File ${{ matrix.name }}.zip.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          files: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.tar.gz.sha256
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.zip.sha256

  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if curl -fsS "https://crates.io/api/v1/crates/ookcite-mcp/$VERSION" >/dev/null; then
            echo "Version $VERSION already published, skipping"
            exit 0
          fi
          cargo publish --allow-dirty

  npm-publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.15.0

      - name: Verify npm public documentation
        run: cmp README.md npm/README.md

      - name: Set version from tag and publish
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          if npm view "@turtletech/ookcite-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already published, skipping"
            exit 0
          fi
          npm publish --access public --provenance 2>&1 || {
            if npm view "@turtletech/ookcite-mcp@$VERSION" version >/dev/null 2>&1; then
              echo "Version $VERSION already published, skipping"
            else
              exit 1
            fi
          }

  registry-publish:
    name: Publish to the MCP registry
    needs: [publish, npm-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC proves this workflow runs in TurtleTech-ehf/ookcite-mcp, which is
      # what authorises the io.github.TurtleTech-ehf/* namespace. No stored
      # credential, and the listing cannot drift from the tag that produced it.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          VERSION=1.8.1
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${VERSION}/mcp-publisher_linux_amd64.tar.gz"
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Check the manifest matches the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(jq -r .version server.json)"
          PACKAGE_VERSION="$(jq -r '.packages[0].version' server.json)"
          for got in "$MANIFEST_VERSION" "$PACKAGE_VERSION"; do
            if [ "$got" != "$TAG_VERSION" ]; then
              echo "server.json says $got but the tag is $TAG_VERSION;" \
                   "scripts/set-version.sh should have moved both" >&2
              exit 1
            fi
          done
          # The registry proves package ownership by requiring the published npm
          # package to name the registry entry back. It reads that from the
          # package on the npm registry, not from this checkout, so a mismatch
          # here means the publish that just ran shipped the wrong value.
          SERVER_NAME="$(jq -r .name server.json)"
          MCP_NAME="$(jq -r '.mcpName // ""' npm/package.json)"
          if [ "$MCP_NAME" != "$SERVER_NAME" ]; then
            echo "npm/package.json mcpName is '${MCP_NAME:-unset}' but server.json" \
                 "name is '$SERVER_NAME'; the registry will reject the publish" >&2
            exit 1
          fi

      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
